name: Daily Security & Dependency Audit

on:
  schedule:
    # Runs at 02:00 UTC daily
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  vulnerability-scan:
    name: Pip-Audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Core Packaging Tools & Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pip-audit -r requirements.txt

      - name: Audit Declared Dependencies
        run: |
          pip-audit -r requirements.txt --desc on

      - name: Audit Full Environment
        run: |
          pip-audit --desc on
