name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Code Quality & Headless Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest Pillow "qrcode[pil]" opencv-python-headless

      - name: Syntax & Fatal Error Linting (flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined variables
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Compile Check Python Scripts
        run: |
          python -m py_compile "Python GUI Chat Application/server chat application.py"
          python -m py_compile "Python GUI Chat Application/client chat application.py"
          python -m py_compile "QR Code Generator/QR Code Generator.py"
          python -m py_compile "Contour Detection - OpenCV/Contour Detection.py"
          python -m py_compile "Edge Detection - OpenCV/Edge Detection.py"

      - name: Headless QR Code Generator Test
        run: |
          python "QR Code Generator/QR Code Generator.py"
          test -s "QR Code Generator/qrchannel.png"

      - name: Headless Batch Image Processing Test
        run: |
          python "Edge Detection - OpenCV/batch_edge_processor.py" --input-dir "Edge Detection - OpenCV" --output-dir "/tmp/edge_output"
          python "Contour Detection - OpenCV/batch_contour_processor.py" --input-dir "Contour Detection - OpenCV" --output-dir "/tmp/contour_output"
